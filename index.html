<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordel-hjälp</title>
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <div id="app">
      <div class="container">
        <h1>Ordel-hjälp</h1>

        <div class="input-section">
          <div class="input-group">
            <label id="correct-label">Rätt bokstäver på rätt plats</label>
            <div class="letter-boxes" aria-labelledby="correct-label">
              <input
                v-for="position in letterPositions"
                :key="`correct-${position}`"
                type="text"
                class="letter-box"
                :id="`correct-${position}`"
                v-model="correctLetters[position]"
                maxlength="1"
                inputmode="text"
                autocomplete="off"
                autocapitalize="characters"
                :aria-label="`Rätt bokstav på plats ${position + 1}`"
                @input="handleCorrectInput($event, position)"
                @keydown.backspace="handleCorrectBackspace($event, position)"
                @keydown.space="handleCorrectSpace($event, position)"
                @paste.prevent="handleCorrectPaste($event, position)"
              />
            </div>
          </div>

          <div class="input-group">
            <label id="misplaced-label"
              >Bokstäver som finns, men inte på denna plats</label
            >
            <div class="letter-boxes" aria-labelledby="misplaced-label">
              <input
                v-for="position in letterPositions"
                :key="`misplaced-${position}`"
                type="text"
                class="misplaced-box"
                :id="`misplaced-${position}`"
                v-model="misplacedLetters[position]"
                maxlength="4"
                inputmode="text"
                autocomplete="off"
                autocapitalize="characters"
                :aria-label="`Felplacerade bokstäver för plats ${position + 1}`"
                @input="handleMisplacedInput($event, position)"
                @keydown.backspace="handleMisplacedBackspace($event, position)"
                @keydown.space="handleMisplacedSpace($event, position)"
              />
            </div>
          </div>

          <div class="input-group">
            <label for="exclude">Bokstäver att utesluta</label>
            <input
              type="text"
              id="exclude"
              v-model="exclude"
              autocomplete="off"
              autocapitalize="characters"
              @input="handleLetterFieldInput($event, 'exclude')"
              @keydown.backspace="handleExcludeBackspace"
            />
          </div>
        </div>

        <div class="button-group">
          <button class="btn-search" @click="search">Sök</button>
          <button class="btn-clear" @click="clear">Rensa</button>
        </div>

        <div v-if="error" class="error">{{ error }}</div>

        <div v-if="searching" class="loading">Söker...</div>

        <div v-else-if="results.length > 0" class="results-section">
          <div class="results-header">
            <span class="results-title">Möjliga ord</span>
            <span class="results-count">{{ results.length }}</span>
          </div>
          <div class="word-list">
            <div
              v-for="word in results.slice(0, 100)"
              :key="word"
              class="word-item"
              @click="copyWord(word)"
            >
              {{ word.toUpperCase() }}
            </div>
          </div>
          <p v-if="results.length > 100" class="info-box">
            Visar 100 av {{ results.length }} möjliga ord. Begränsa sökningen
            för färre resultat.
          </p>
        </div>

        <div v-else-if="hasSearched" class="no-results">
          <p>Inga ord hittas med dessa kriterier.</p>
        </div>

        <div class="info-box" v-if="wordCount > 0">
          Ordlista innehåller {{ wordCount }} ord.
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="words.js"></script>
    <script src="app.js?v=5"></script>
  </body>
</html>

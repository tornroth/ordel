<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordel-hjälp</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 32px 20px 20px;
      }

      #app {
        width: 100%;
        max-width: 600px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        padding: 30px;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
        font-size: 2em;
      }

      .input-section {
        display: grid;
        gap: 20px;
        margin-bottom: 30px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
      }

      label {
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 0.95em;
      }

      input[type='text'] {
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 1em;
        text-transform: uppercase;
        transition: border-color 0.3s;
      }

      input[type='text']:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      input[type='text']::placeholder {
        color: #999;
      }

      .letter-boxes {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .letter-box {
        width: 100%;
        aspect-ratio: 1;
        padding: 0;
        text-align: center;
        text-transform: uppercase;
        font-size: 1.45em;
        font-weight: 700;
        line-height: 1;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
      }

      button {
        flex: 1;
        padding: 12px 20px;
        font-size: 1em;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .btn-search {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-search:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .btn-search:active {
        transform: translateY(0);
      }

      .btn-clear {
        background: #f0f0f0;
        color: #333;
      }

      .btn-clear:hover {
        background: #e0e0e0;
      }

      .results-section {
        margin-top: 20px;
      }

      .results-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .results-title {
        font-size: 1.1em;
        font-weight: 600;
        color: #333;
      }

      .results-count {
        background: #667eea;
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.9em;
        font-weight: 600;
      }

      .word-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 10px;
      }

      .word-item {
        background: #f8f9fa;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        padding: 12px;
        text-align: center;
        font-weight: 600;
        font-size: 1.1em;
        cursor: pointer;
        transition: all 0.2s;
        color: #333;
      }

      .word-item:hover {
        border-color: #667eea;
        background: #f0f3ff;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
      }

      .no-results {
        text-align: center;
        padding: 40px 20px;
        color: #999;
      }

      .loading {
        text-align: center;
        padding: 20px;
        color: #667eea;
        font-weight: 600;
      }

      .error {
        background: #fee;
        border: 1px solid #fcc;
        color: #c33;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .info-box {
        background: #f0f3ff;
        border-left: 4px solid #667eea;
        padding: 12px;
        border-radius: 4px;
        font-size: 0.9em;
        color: #555;
        margin-top: 20px;
      }

      @media (max-width: 480px) {
        body {
          padding-top: 20px;
        }

        .container {
          padding: 20px;
        }

        h1 {
          font-size: 1.5em;
        }

        .word-list {
          grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        }

        .word-item {
          padding: 10px;
          font-size: 1em;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="container">
        <h1>Ordel-hjälp</h1>

        <div class="input-section">
          <div class="input-group">
            <label id="correct-label">Rätt bokstäver på rätt plats</label>
            <div class="letter-boxes" aria-labelledby="correct-label">
              <input
                v-for="(_, index) in correctLetters"
                :key="index"
                type="text"
                class="letter-box"
                :id="`correct-${index}`"
                v-model="correctLetters[index]"
                maxlength="1"
                inputmode="text"
                autocomplete="off"
                autocapitalize="characters"
                :aria-label="`Rätt bokstav på plats ${index + 1}`"
                @input="handleCorrectInput($event, index)"
                @keydown.backspace="handleCorrectBackspace($event, index)"
                @keydown.space="handleCorrectSpace($event, index)"
                @paste.prevent="handleCorrectPaste($event, index)"
              />
            </div>
          </div>

          <div class="input-group">
            <label for="contains"
              >Bokstäver som måste vara med (men på fel plats)</label
            >
            <input
              type="text"
              id="contains"
              v-model="contains"
              autocomplete="off"
              autocapitalize="characters"
              @input="handleLetterFieldInput($event, 'contains')"
            />
          </div>

          <div class="input-group">
            <label for="exclude">Bokstäver att utesluta</label>
            <input
              type="text"
              id="exclude"
              v-model="exclude"
              autocomplete="off"
              autocapitalize="characters"
              @input="handleLetterFieldInput($event, 'exclude')"
            />
          </div>
        </div>

        <div class="button-group">
          <button class="btn-search" @click="search">Sök</button>
          <button class="btn-clear" @click="clear">Rensa</button>
        </div>

        <div v-if="error" class="error">{{ error }}</div>

        <div v-if="searching" class="loading">Söker...</div>

        <div v-else-if="results.length > 0" class="results-section">
          <div class="results-header">
            <span class="results-title">Möjliga ord</span>
            <span class="results-count">{{ results.length }}</span>
          </div>
          <div class="word-list">
            <div
              v-for="word in results.slice(0, 100)"
              :key="word"
              class="word-item"
              @click="copyWord(word)"
            >
              {{ word.toUpperCase() }}
            </div>
          </div>
          <p v-if="results.length > 100" class="info-box">
            Visar 100 av {{ results.length }} möjliga ord. Begränsa sökningen
            för färre resultat.
          </p>
        </div>

        <div v-else-if="hasSearched" class="no-results">
          <p>Inga ord hittas med dessa kriterier.</p>
        </div>

        <div class="info-box" v-if="wordCount > 0">
          Ordlista innehåller {{ wordCount }} ord.
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="words.js"></script>
    <script>
      const { createApp } = Vue

      createApp({
        data() {
          return {
            correctLetters: ['', '', '', '', ''],
            contains: '',
            exclude: '',
            results: [],
            searching: false,
            hasSearched: false,
            error: '',
            wordCount: 0,
            wordList: []
          }
        },
        mounted() {
          this.loadWordList()
        },
        methods: {
          loadWordList() {
            try {
              // Get words from the global WORDS array defined in words.js
              if (typeof WORDS !== 'undefined') {
                this.wordList = WORDS.map((w) => w.toLowerCase())
                this.wordCount = this.wordList.length
              } else {
                this.error =
                  'Ordlistan kunde inte laddas. Försök uppdatera sidan.'
              }
            } catch (e) {
              this.error = 'Ett fel uppstod vid inläsning av ordlistan.'
              console.error('Error loading word list:', e)
            }
          },
          sanitizeLetters(value) {
            return value.toUpperCase().match(/[A-ZÅÄÖ]/g) || []
          },
          sanitizeLetterString(value) {
            return this.sanitizeLetters(value).join('')
          },
          uniqueLetters(letters) {
            return [...new Set(letters)]
          },
          getRequiredLetters() {
            return new Set([
              ...this.correctLetters.filter(Boolean),
              ...this.contains.split('')
            ])
          },
          removeRequiredLettersFromExclude() {
            const requiredLetters = this.getRequiredLetters()
            this.exclude = this.exclude
              .split('')
              .filter((letter) => !requiredLetters.has(letter))
              .join('')
          },
          handleLetterFieldInput(event, field) {
            const letters = this.uniqueLetters(
              this.sanitizeLetters(event.target.value)
            )

            if (field === 'contains') {
              this.contains = letters.join('')
              this.removeRequiredLettersFromExclude()
            } else if (field === 'exclude') {
              const requiredLetters = this.getRequiredLetters()
              this.exclude = letters
                .filter((letter) => !requiredLetters.has(letter))
                .join('')
            }

            event.target.value = this[field]
            this.search()
          },
          focusCorrectBox(index) {
            this.$nextTick(() => {
              document.getElementById(`correct-${index}`)?.focus()
            })
          },
          handleCorrectInput(event, index) {
            const letters = this.sanitizeLetters(event.target.value)

            if (letters.length === 0) {
              this.correctLetters[index] = ''
              event.target.value = ''
              this.search()
              return
            }

            this.correctLetters[index] = letters[0]
            event.target.value = letters[0]

            if (letters.length > 1) {
              this.fillCorrectLetters(letters.slice(1), index + 1)
            } else if (index < this.correctLetters.length - 1) {
              this.focusCorrectBox(index + 1)
            }

            this.removeRequiredLettersFromExclude()
            this.search()
          },
          handleCorrectPaste(event, index) {
            const pastedText = event.clipboardData?.getData('text') || ''
            const letters = this.sanitizeLetters(pastedText)
            this.fillCorrectLetters(letters, index)
            this.removeRequiredLettersFromExclude()
            this.search()
          },
          handleCorrectBackspace(event, index) {
            if (this.correctLetters[index] || index === 0) return

            event.preventDefault()
            this.correctLetters[index - 1] = ''
            this.focusCorrectBox(index - 1)
            this.search()
          },
          handleCorrectSpace(event, index) {
            event.preventDefault()

            if (index < this.correctLetters.length - 1) {
              this.focusCorrectBox(index + 1)
            }
          },
          fillCorrectLetters(letters, startIndex) {
            letters.forEach((letter, offset) => {
              const targetIndex = startIndex + offset
              if (targetIndex < this.correctLetters.length) {
                this.correctLetters[targetIndex] = letter
              }
            })

            const nextEmptyIndex = this.correctLetters.findIndex(
              (letter, index) => index >= startIndex && !letter
            )
            const focusIndex =
              nextEmptyIndex === -1
                ? Math.min(
                    startIndex + letters.length,
                    this.correctLetters.length - 1
                  )
                : nextEmptyIndex

            this.focusCorrectBox(focusIndex)
          },
          getCorrectPattern() {
            if (this.correctLetters.every((letter) => !letter)) return ''

            return this.correctLetters
              .map((letter) => letter.toLowerCase() || '_')
              .join('')
          },
          getRequiredLetterCounts() {
            return [...this.correctLetters, ...this.contains.split('')]
              .filter(Boolean)
              .reduce((counts, letter) => {
                const lowerCaseLetter = letter.toLowerCase()
                counts[lowerCaseLetter] = (counts[lowerCaseLetter] || 0) + 1
                return counts
              }, {})
          },
          getWordLetterCounts(word) {
            return word.split('').reduce((counts, letter) => {
              counts[letter] = (counts[letter] || 0) + 1
              return counts
            }, {})
          },
          search() {
            this.error = ''
            this.hasSearched = true
            const correctPattern = this.getCorrectPattern()
            const requiredLetterCounts = this.getRequiredLetterCounts()

            if (!correctPattern && !this.contains && !this.exclude) {
              this.results = []
              this.hasSearched = false
              return
            }

            this.searching = true

            setTimeout(() => {
              try {
                this.results = this.wordList.filter((word) => {
                  if (word.length !== 5) return false

                  // Check correct pattern
                  if (correctPattern) {
                    for (let i = 0; i < 5; i++) {
                      if (
                        correctPattern[i] !== '_' &&
                        correctPattern[i] !== word[i]
                      ) {
                        return false
                      }
                    }
                  }

                  const wordLetterCounts = this.getWordLetterCounts(word)

                  // Check required letter counts, including duplicate clues.
                  for (let letter in requiredLetterCounts) {
                    if (
                      (wordLetterCounts[letter] || 0) <
                      requiredLetterCounts[letter]
                    ) {
                      return false
                    }
                  }

                  // Check exclude
                  if (this.exclude) {
                    const excludeLetters = this.exclude.toLowerCase().split('')
                    for (let letter of excludeLetters) {
                      if (word.includes(letter)) return false
                    }
                  }

                  return true
                })

                // Sort results alphabetically
                this.results.sort()
              } catch (e) {
                this.error = 'Ett fel uppstod vid sökningen.'
                console.error('Search error:', e)
              }

              this.searching = false
            }, 100)
          },
          clear() {
            this.correctLetters = ['', '', '', '', '']
            this.contains = ''
            this.exclude = ''
            this.results = []
            this.hasSearched = false
            this.error = ''
          },
          copyWord(word) {
            navigator.clipboard
              .writeText(word.toUpperCase())
              .then(() => {
                // Show brief feedback
                const originalCount = this.wordCount
                this.wordCount = -1 // Temporary signal
                setTimeout(() => {
                  this.wordCount = originalCount
                }, 1500)
              })
              .catch((err) => {
                console.error('Failed to copy:', err)
              })
          }
        }
      }).mount('#app')
    </script>
  </body>
</html>
